server:
  host: 192.168.30.133
  port: 8000
  secure: false

session:
  # Named profile (created via POST /v1/profiles or the control panel). It owns the
  # STT engine + language, TTS voice, LLM model/system prompt, MCP tools and memory
  # — so this device configures only which profile to connect to, not the engines.
  # Leave null to fall back to the server's own .env defaults.
  profile: null
  # Barge-in: let the user interrupt the assistant by speaking over it. Needs a mic
  # well-isolated from the speaker (or hardware AEC) — otherwise speaker bleed
  # self-triggers it. Off by default; tune the RMS threshold to your hardware.
  allow_barge_in: false
  barge_in_rms_threshold: 1200.0   # int16 RMS the mic must exceed during playback
  barge_in_min_frames: 5           # consecutive loud frames (×frame_ms) to confirm
  # Where the last server-assigned session_id is cached, so reconnects (WiFi blips,
  # service restarts) resume the same conversation/history instead of starting a new
  # one each time. Delete this file to force a fresh session.
  session_state_path: ~/.cache/agent-assistant/session_id

audio:
  input_sample_rate: 16000
  output_sample_rate: 16000
  uplink_sample_rate: 16000
  frame_ms: 60
  input_channels: 1
  output_channels: 1
  input_device: null
  output_device: null
  input_alsa_device: null
  output_alsa_device: null
  playback_preroll_ms: 200   # jitter buffer pre-roll before playback starts (smoothness)

service:
  reconnect_initial_seconds: 1.0
  reconnect_max_seconds: 20.0
  log_events: true

led:
  enabled: true
  yellow_pin: 13
  red_pin: 22
  green_pin: 17

oled:
  enabled: true
  i2c_port: 1
  i2c_address: 60
  font_path: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf   # override if your image lacks this font
